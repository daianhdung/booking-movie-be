# Flyway configuration for booking-movie-be
# Environment variables are resolved by Flyway at runtime.

flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
flyway.user=${DB_USERNAME:postgres}
flyway.password=${DB_PASSWORD:postgres}
flyway.locations=filesystem:./src/database/flyway

# Safe defaults for existing local databases.
flyway.baselineOnMigrate=true
flyway.validateMigrationNaming=true
